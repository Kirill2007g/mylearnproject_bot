[project]
name = "mylearnprojectbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kirill", email = "kapitanxek@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "asyncpg>=0.32.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.1",
    "pytest>=9.1.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
mylearnprojectbot = "mylearnprojectbot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
